name: release

# Three jobs rather than one so that "Re-run failed jobs" repairs a failed upload
# against the .ipa already built and signed. See the README.

on:
  workflow_dispatch:
    inputs:
      version:
        description: version to build, e.g. 1.36 - required unless this is a dry run
        type: string
      dry_run:
        description: build and archive only, do not upload
        type: boolean
        default: false

concurrency:
  # workflow wide, not per ref: the build number is a live query of what
  # TestFlight has, so two overlapping runs would read the same one
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  xcode_version: "26.5"
  dry_run: ${{ inputs.dry_run }}

jobs:
  build:
    runs-on: macos-26
    steps:
      # a dry run signs too, so it needs the same secrets
      - name: check secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          SIGNING_CERTIFICATE_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_CONTENT SIGNING_CERTIFICATE_P12 SIGNING_CERTIFICATE_PASSWORD; do
            [ -n "${!name:-}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing repository secrets:$missing (see README)"
            exit 1
          fi

      - name: checkout
        uses: actions/checkout@v7

      # before the build, so a run that cannot name a version fails in seconds
      - name: resolve version
        id: version
        # through the environment rather than the run: line, where the input
        # would be a shell injection
        env:
          given: ${{ inputs.version }}
        run: .github/scripts/resolve-version.py --input "$given" --dry-run "$dry_run"

      # this section becomes the release body, so a dry run checks it too
      - name: check the changelog names this version
        if: ${{ steps.version.outputs.version != '' }}
        env:
          version: ${{ steps.version.outputs.version }}
        run: .github/scripts/changelog-section.py --version "$version"

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.xcode_version }}

      # a throwaway keychain so the distribution certificate never outlives the job
      - name: import signing certificate
        env:
          SIGNING_CERTIFICATE_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"

          security create-keychain -p "$password" "$keychain"
          # long enough to outlast both archives: a keychain that relocks mid run
          # fails codesign with "User interaction is not allowed"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          echo "$SIGNING_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$keychain" \
            -P "$SIGNING_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          rm "$RUNNER_TEMP/certificate.p12"

          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychain -d user -s "$keychain" login.keychain-db

          # a development certificate here would archive fine and fail the export
          # twenty minutes in
          identities="$(security find-identity -v -p codesigning "$keychain")"
          echo "$identities"
          if ! grep -q "Apple Distribution\|iPhone Distribution" <<< "$identities"; then
            echo "::error::SIGNING_CERTIFICATE_P12 holds no Apple Distribution certificate (see README)"
            exit 1
          fi

      # once, for both: querying again after Pro's upload would hand Lite a higher
      # number
      - name: resolve build number
        id: build_number
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: bundle exec fastlane ios resolveBuildNumber

      - name: build both apps
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          ODR_VERSION: ${{ steps.version.outputs.version }}
          ODR_DRY_RUN: ${{ inputs.dry_run }}
          ODR_BUILD_NUMBER: ${{ steps.build_number.outputs.build_number }}
        run: |
          set -euo pipefail
          # empty here means each build would ask the store for its own number
          [ -n "$ODR_BUILD_NUMBER" ] || { echo "::error::resolveBuildNumber produced no build number"; exit 1; }

          bundle exec fastlane ios buildPro
          bundle exec fastlane ios buildLite
          # travels with the archives: a re-run may skip this job, so record
          # cannot read its outputs
          echo "$ODR_BUILD_NUMBER" > build-number.txt

      # on a dry run too: archiving the signed .ipa is the point of one
      - name: archive the ipas
        uses: actions/upload-artifact@v7
        with:
          name: ipas
          path: |
            build/*.ipa
            build-number.txt
          if-no-files-found: error
          compression-level: 0

      # gym's log only says the export failed; the reason is in an
      # .xcdistributionlogs bundle under $TMPDIR, which dies with the runner
      - name: collect distribution logs
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p distribution-logs
          find "${TMPDIR:-/tmp}" -maxdepth 1 -name '*.xcdistributionlogs' \
            -exec cp -R {} distribution-logs/ \;

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-log
          path: |
            ~/Library/Logs/gym
            distribution-logs
            build/*.app.dSYM.zip
          if-no-files-found: warn

  # a job per app, fail-fast off, so "Re-run failed jobs" can retry one half
  upload:
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: pro
            lane: uploadPro
          - app: lite
            lane: uploadLite
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: fetch the ipas
        uses: actions/download-artifact@v8
        with:
          name: ipas

      # no keychain and no profile: the archive is signed already
      - name: upload ${{ matrix.app }} to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: bundle exec fastlane ios ${{ matrix.lane }}

  record:
    needs: upload
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v7

      # re-resolved rather than carried over: the input is the same every time
      - name: resolve version
        id: version
        env:
          given: ${{ inputs.version }}
        run: .github/scripts/resolve-version.py --input "$given" --dry-run "$dry_run"

      - name: fetch the ipas
        uses: actions/download-artifact@v8
        with:
          name: ipas

      - name: tag the build that went out
        env:
          version: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          build_number=$(cat build-number.txt)
          [ -n "$build_number" ] || { echo "::error::build-number.txt is empty"; exit 1; }

          tag="build/v$version/$build_number"

          # a re-run behind a repaired upload is expected, so an existing tag is
          # only wrong when it names a different commit
          if git ls-remote --exit-code --tags origin "$tag" > /dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
            already=$(git rev-list -n1 "$tag")
            if [ "$already" != "$GITHUB_SHA" ]; then
              echo "::error::$tag already names $already, not $GITHUB_SHA (this upload did go through)"
              exit 1
            fi
            echo "$tag was already written by an earlier attempt"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" \
              -m "$version, build $build_number, uploaded to App Store Connect" \
              -m "run: $GITHUB_RUN_ID"
            git push origin "$tag"
          fi
          echo "\`$GITHUB_SHA\` is \`$tag\`" >> "$GITHUB_STEP_SUMMARY"

      # a draft creates no tag; publishing it does. --target takes the sha, not a
      # branch, which would resolve to whatever main had become by then
      - name: draft the github release
        env:
          GH_TOKEN: ${{ github.token }}
          version: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          .github/scripts/changelog-section.py --version "$version" > "${RUNNER_TEMP}/notes.md"

          # the version input is bare, the tag it publishes is prefixed
          tag="v$version"

          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --target "$GITHUB_SHA" --notes-file "${RUNNER_TEMP}/notes.md"
          else
            # --generate-notes appends the pull requests below the changelog section
            gh release create "$tag" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --notes-file "${RUNNER_TEMP}/notes.md" \
              --generate-notes
          fi

          echo "drafted \`$tag\`. publishing it writes the tag - do that once it is live." >> "$GITHUB_STEP_SUMMARY"
