name: release

# Several jobs rather than one so that "Re-run failed jobs" repairs a failed upload
# against the .ipa already built and signed. See the README.

on:
  workflow_dispatch:
    inputs:
      version:
        description: version to build, e.g. 1.36 - required unless this is a dry run
        type: string
      dry_run:
        description: build and archive only, do not upload
        type: boolean
        default: false

concurrency:
  # workflow wide, not per ref: the build number is a live query of what
  # TestFlight has, so two overlapping runs would read the same one
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  xcode_version: "26.5"
  dry_run: ${{ inputs.dry_run }}

jobs:
  build:
    runs-on: macos-26
    steps:
      # a dry run signs too, so it needs the same secrets
      - name: check secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          SIGNING_CERTIFICATE_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_CONTENT SIGNING_CERTIFICATE_P12 SIGNING_CERTIFICATE_PASSWORD; do
            [ -n "${!name:-}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing repository secrets:$missing (see README)"
            exit 1
          fi

      - name: checkout
        uses: actions/checkout@v7

      # before the build, so a run that cannot name a version fails in seconds
      - name: resolve version
        id: version
        # through the environment rather than the run: line, where the input
        # would be a shell injection
        env:
          given: ${{ inputs.version }}
        run: scripts/resolve-version.py --input "$given" --dry-run "$dry_run"

      # this section becomes the release body, so a dry run checks it too
      - name: check the changelog names this version
        if: ${{ steps.version.outputs.version != '' }}
        env:
          version: ${{ steps.version.outputs.version }}
        run: scripts/changelog_section.py --version "$version"

      # what the listing job uploads, so a missing translation fails here rather
      # than once both apps are up
      - name: check the store copy is written in every locale
        if: ${{ steps.version.outputs.version != '' }}
        env:
          version: ${{ steps.version.outputs.version }}
        run: scripts/store_listing.py --version "$version"

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.xcode_version }}

      # a throwaway keychain so the distribution certificate never outlives the job
      - name: import signing certificate
        env:
          SIGNING_CERTIFICATE_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"

          security create-keychain -p "$password" "$keychain"
          # long enough to outlast both archives: a keychain that relocks mid run
          # fails codesign with "User interaction is not allowed"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          echo "$SIGNING_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$keychain" \
            -P "$SIGNING_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          rm "$RUNNER_TEMP/certificate.p12"

          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychain -d user -s "$keychain" login.keychain-db

          # a development certificate here would archive fine and fail the export
          # twenty minutes in
          identities="$(security find-identity -v -p codesigning "$keychain")"
          echo "$identities"
          if ! grep -q "Apple Distribution\|iPhone Distribution" <<< "$identities"; then
            echo "::error::SIGNING_CERTIFICATE_P12 holds no Apple Distribution certificate (see README)"
            exit 1
          fi

      # once, for both: querying again after Pro's upload would hand Lite a higher
      # number
      - name: resolve build number
        id: build_number
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: bundle exec fastlane ios resolveBuildNumber

      - name: build both apps
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          ODR_VERSION: ${{ steps.version.outputs.version }}
          ODR_DRY_RUN: ${{ inputs.dry_run }}
          ODR_BUILD_NUMBER: ${{ steps.build_number.outputs.build_number }}
        run: |
          set -euo pipefail
          # empty here means each build would ask the store for its own number
          [ -n "$ODR_BUILD_NUMBER" ] || { echo "::error::resolveBuildNumber produced no build number"; exit 1; }

          bundle exec fastlane ios buildPro
          bundle exec fastlane ios buildLite
          # travels with the archives: a re-run may skip this job, so record
          # cannot read its outputs
          echo "$ODR_BUILD_NUMBER" > build-number.txt

      # on a dry run too: archiving the signed .ipa is the point of one
      - name: archive the ipas
        uses: actions/upload-artifact@v7
        with:
          name: ipas
          path: |
            build/*.ipa
            build-number.txt
          if-no-files-found: error
          compression-level: 0

      # gym's log only says the export failed; the reason is in an
      # .xcdistributionlogs bundle under $TMPDIR, which dies with the runner
      - name: collect distribution logs
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p distribution-logs
          find "${TMPDIR:-/tmp}" -maxdepth 1 -name '*.xcdistributionlogs' \
            -exec cp -R {} distribution-logs/ \;

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-log
          path: |
            ~/Library/Logs/gym
            distribution-logs
            build/*.app.dSYM.zip
          if-no-files-found: warn

  # Beside the build rather than behind it: it signs nothing and uploads nothing,
  # it just drives simulators, and it takes about as long. On a dry run too -
  # the artifact is the only way to look at the pictures before the store does.
  # A runner per device rather than one doing both. Two simulators on the seven
  # gigabytes a runner has spent their time swapping, and the runs took five
  # times as long as they do alone; a device to a machine is that, structurally.
  # It halves the wall clock as well, since the two halves photograph at once.
  screenshots:
    runs-on: macos-26
    # long by nature, but the default is six hours for a wedged simulator to sit in
    timeout-minutes: 180
    strategy:
      # one device failing should not throw away the other's hour of work
      fail-fast: false
      matrix:
        device: [iphone, ipad]
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.xcode_version }}

      # the framing draws with Pillow, which is the one thing the scripts here
      # want that is not in the standard library
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python3 -m pip install --quiet Pillow

      # The lane builds once into build/screenshots and photographs eighteen
      # times without building again. Keeping it means a rerun starts at the
      # first simulator instead of at the compiler. Keyed on everything the
      # build reads, so a stale one is never used - only ever missed.
      - name: reuse the last build
        uses: actions/cache@v6
        with:
          path: build/screenshots
          key: screenshots-${{ matrix.device }}-${{ runner.os }}-${{ env.xcode_version }}-${{ hashFiles('OpenDocumentReader.xcodeproj/project.pbxproj', 'OpenDocumentReader.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'OpenDocumentReader/**', 'OpenDocumentReaderUITests/**', 'Ads/**', 'NoAds/**', 'configs/**', 'scripts/make-screenshot-documents.py') }}

      # half a set, so the lane does not check it - the job below does, once
      # both halves are in
      - name: photograph the ${{ matrix.device }} in every locale
        env:
          ODR_SCREENSHOT_DEVICE: ${{ matrix.device }}
        run: bundle exec fastlane ios screenshots

      # what the store is given
      - name: archive the framed screenshots
        uses: actions/upload-artifact@v7
        with:
          name: framed-${{ matrix.device }}
          path: fastlane/framed
          if-no-files-found: error
          # png, so there is nothing left to squeeze out of them
          compression-level: 0

      # and what they were framed from, which is where to look when a picture
      # comes out wrong
      - name: archive the raw captures
        # also when the lane failed: a half finished set is what says which
        # language it got to
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.device }}
          path: fastlane/screenshots
          if-no-files-found: warn
          compression-level: 0

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshot-log-${{ matrix.device }}
          path: ~/Library/Logs/snapshot
          if-no-files-found: warn

  # The two halves put back together, and only now checked: a set is both
  # devices in every locale, and neither runner above can see the other's.
  # Republished under the names the release reads.
  screenshot-set:
    needs: screenshots
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: fetch both halves
        uses: actions/download-artifact@v8
        with:
          pattern: framed-*
          merge-multiple: true
          path: fastlane/framed

      - name: fetch what they were framed from
        uses: actions/download-artifact@v8
        with:
          pattern: screenshots-*
          merge-multiple: true
          path: fastlane/screenshots

      # the check the lane cannot do on half a set: every locale, both devices,
      # at a size App Store Connect takes
      - name: check the set
        run: scripts/store_screenshots.py --screenshots fastlane/framed

      - name: archive the framed screenshots
        uses: actions/upload-artifact@v7
        with:
          name: framed
          path: fastlane/framed
          if-no-files-found: error
          compression-level: 0

      - name: archive the raw captures
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: fastlane/screenshots
          if-no-files-found: warn
          compression-level: 0

  # a job per app, fail-fast off, so "Re-run failed jobs" can retry one half
  upload:
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: pro
            lane: uploadPro
          - app: lite
            lane: uploadLite
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: fetch the ipas
        uses: actions/download-artifact@v8
        with:
          name: ipas

      # no keychain and no profile: the archive is signed already
      - name: upload ${{ matrix.app }} to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: bundle exec fastlane ios ${{ matrix.lane }}

  # its own job because the listing stays editable until the version is submitted,
  # while a build cannot be uploaded twice. No macOS runner: this touches the
  # listing, not the app
  listing:
    needs: [upload, screenshot-set]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: pro
            lane: uploadListingPro
          - app: lite
            lane: uploadListingLite
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: resolve version
        id: version
        env:
          given: ${{ inputs.version }}
        run: scripts/resolve-version.py --input "$given" --dry-run "$dry_run"

      # where the lane looks for them, and the same set both apps are given
      - name: fetch the screenshots
        uses: actions/download-artifact@v8
        with:
          name: framed
          path: fastlane/framed

      # Kept, because the check below reads it. `tee` rather than a redirect so
      # the step still shows what it is doing while it runs.
      - name: write ${{ matrix.app }}'s listing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          ODR_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -o pipefail
          bundle exec fastlane ios ${{ matrix.lane }} 2>&1 | tee listing.log

      # The Fastfile stops deliver from sending a picture twice, so neither of
      # these should ever print. They stay because both are silent in the store
      # and in this log: deliver ends "Successfully uploaded all screenshots"
      # and the job goes green either way. If a fastlane upgrade moves what the
      # Fastfile patches, this is what still notices.
      - name: the screenshots went up once each
        run: |
          set -euo pipefail
          if grep -q "Failed to upload all screenshots" listing.log; then
            echo "::error::deliver uploaded ${{ matrix.app }}'s screenshots a second time, which leaves locales holding the same picture twice. Look at the set for every locale before submitting."
            exit 1
          fi
          if grep -q "Too many screenshots found" listing.log; then
            echo "::error::a locale of ${{ matrix.app }} was full at ten screenshots and the rest were dropped. The locales named above are short. Look at the set for every locale before submitting."
            exit 1
          fi

  record:
    needs: upload
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v7

      # re-resolved rather than carried over: the input is the same every time
      - name: resolve version
        id: version
        env:
          given: ${{ inputs.version }}
        run: scripts/resolve-version.py --input "$given" --dry-run "$dry_run"

      - name: fetch the ipas
        uses: actions/download-artifact@v8
        with:
          name: ipas

      - name: tag the build that went out
        env:
          version: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          build_number=$(cat build-number.txt)
          [ -n "$build_number" ] || { echo "::error::build-number.txt is empty"; exit 1; }

          tag="build/v$version/$build_number"

          # a re-run behind a repaired upload is expected, so an existing tag is
          # only wrong when it names a different commit
          if git ls-remote --exit-code --tags origin "$tag" > /dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
            already=$(git rev-list -n1 "$tag")
            if [ "$already" != "$GITHUB_SHA" ]; then
              echo "::error::$tag already names $already, not $GITHUB_SHA (this upload did go through)"
              exit 1
            fi
            echo "$tag was already written by an earlier attempt"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" \
              -m "$version, build $build_number, uploaded to App Store Connect" \
              -m "run: $GITHUB_RUN_ID"
            git push origin "$tag"
          fi
          echo "\`$GITHUB_SHA\` is \`$tag\`" >> "$GITHUB_STEP_SUMMARY"

      # a draft creates no tag; publishing it does. --target takes the sha, not a
      # branch, which would resolve to whatever main had become by then
      - name: draft the github release
        env:
          GH_TOKEN: ${{ github.token }}
          version: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          scripts/changelog_section.py --version "$version" > "${RUNNER_TEMP}/notes.md"

          # the version input is bare, the tag it publishes is prefixed
          tag="v$version"

          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --target "$GITHUB_SHA" --notes-file "${RUNNER_TEMP}/notes.md"
          else
            # --generate-notes appends the pull requests below the changelog section
            gh release create "$tag" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --notes-file "${RUNNER_TEMP}/notes.md" \
              --generate-notes
          fi

          echo "drafted \`$tag\`. publishing it writes the tag - do that once it is live." >> "$GITHUB_STEP_SUMMARY"
