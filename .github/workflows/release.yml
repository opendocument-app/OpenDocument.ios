name: release

# Builds both apps once, uploads each to App Store Connect, then records what went
# out. Three jobs, because that is what makes a half uploaded release repairable:
# if Lite's upload fails alone, "Re-run failed jobs" retries just that job against
# the .ipa already built and signed - build number included, since it is baked in
# at archive time.
#
# Both apps always go out together and nothing chooses one. They are the same app
# with ads and tracking switched off, and they share a build number so that one
# (version, build) pair names one commit in both listings.
#
# Nothing is triggered by a tag. A version can take several builds to get through
# review, so a tag pushed beforehand names a commit that may never ship;
# build/<version>/<build> is written after each upload, and the plain <version> tag
# appears only when the drafted release is published, once it is really live.
#
# project.pbxproj holds 0.0.0 and 1: the version comes from the dispatch input and
# the build number from App Store Connect, so a release needs no commit.

on:
  workflow_dispatch:
    inputs:
      version:
        description: version to build, e.g. 1.36 - required unless this is a dry run
        type: string
      dry_run:
        description: build and archive only, do not upload
        type: boolean
        default: false

concurrency:
  # every release run, not just the ones on the same ref: the build number is a
  # live query of what TestFlight has, so two overlapping runs would read the same
  # one and hand the second upload a pair the store has already taken
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  xcode_version: "26.5"
  dry_run: ${{ inputs.dry_run }}

jobs:
  build:
    runs-on: macos-26
    steps:
      # a dry run signs too, so it needs the same secrets
      - name: check secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          SIGNING_CERTIFICATE_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_CONTENT SIGNING_CERTIFICATE_P12 SIGNING_CERTIFICATE_PASSWORD; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing repository secrets:$missing (see README)"
            exit 1
          fi

      - name: checkout
        uses: actions/checkout@v7

      # up front, so a run that cannot name a version ends before the twenty
      # minutes of setup and building rather than after
      - name: resolve version
        id: version
        # through the environment rather than the run: line, where the input would
        # be a shell injection
        env:
          given: ${{ inputs.version }}
        run: .github/scripts/resolve-version.py --input "$given" --dry-run "$dry_run"

      # whenever there is a version, dry run or not: the record job publishes this
      # section as the release body, and a dry run is the rehearsal for that. no
      # build tag is checked - unlike Android, a second build of one version is normal
      - name: check the changelog names this version
        if: ${{ steps.version.outputs.version != '' }}
        env:
          version: ${{ steps.version.outputs.version }}
        run: .github/scripts/changelog-section.py --version "$version" > /dev/null

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.xcode_version }}

      # a throwaway keychain so the distribution certificate never outlives the job
      - name: import signing certificate
        env:
          SIGNING_CERTIFICATE_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"

          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          echo "$SIGNING_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$keychain" \
            -P "$SIGNING_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          rm "$RUNNER_TEMP/certificate.p12"

          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychain -d user -s "$keychain" login.keychain-db

          # this is the only certificate the build has - a development one here
          # would archive fine and fail the export twenty minutes in
          security find-identity -v -p codesigning "$keychain"
          if ! security find-identity -v -p codesigning "$keychain" | grep -q "Apple Distribution\|iPhone Distribution"; then
            echo "::error::SIGNING_CERTIFICATE_P12 holds no Apple Distribution certificate (see README)"
            exit 1
          fi

      # once, for both: querying again after Pro's upload would hand Lite a higher
      # number and lose the very thing sharing one is for
      - name: resolve build number
        id: build_number
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: bundle exec fastlane ios resolveBuildNumber

      - name: build both apps
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          # environment rather than lane options, which fastlane passes through as
          # strings - a false would arrive as "false" and read as true
          ODR_VERSION: ${{ steps.version.outputs.version }}
          ODR_DRY_RUN: ${{ env.dry_run }}
          ODR_BUILD_NUMBER: ${{ steps.build_number.outputs.build_number }}
          number: ${{ steps.build_number.outputs.build_number }}
        run: |
          bundle exec fastlane ios buildPro
          bundle exec fastlane ios buildLite
          # travels with the archives: the record job cannot re-derive this the way
          # it re-derives the version, and a job output of a job that a re-run did
          # not repeat is not something to depend on
          echo "$number" > build-number.txt

      # archived on a dry run too - that is how the signing path gets exercised
      - name: Artifact ipas
        uses: actions/upload-artifact@v7
        with:
          name: ipas
          path: |
            build/*.ipa
            build-number.txt
          if-no-files-found: error
          compression-level: 0

      # gym's log only says the export failed; the reason is in an
      # .xcdistributionlogs bundle under $TMPDIR, which dies with the runner
      - name: collect distribution logs
        if: failure()
        run: |
          mkdir -p distribution-logs
          find "${TMPDIR:-/tmp}" -maxdepth 1 -name '*.xcdistributionlogs' \
            -exec cp -R {} distribution-logs/ \;

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-log
          path: |
            ~/Library/Logs/gym
            distribution-logs
            build/*.app.dSYM.zip
          if-no-files-found: warn

  # a job per app rather than two calls in one, so "Re-run failed jobs" can retry
  # one half. fail-fast off for the same reason
  upload:
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: pro
            lane: uploadPro
          - app: lite
            lane: uploadLite
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # back to build/, where upload_ipa looks for it
      - name: fetch the ipas
        uses: actions/download-artifact@v8
        with:
          name: ipas

      # no keychain and no profile: the archive is signed already
      - name: upload ${{ matrix.app }} to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: bundle exec fastlane ios ${{ matrix.lane }}

  # only once both apps are up, so a half uploaded release is not recorded at all
  record:
    needs: upload
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v7

      # re-resolved rather than carried as a job output: a re-run may not repeat
      # the job that produced it, while the dispatch input is the same every time
      - name: resolve version
        id: version
        env:
          given: ${{ inputs.version }}
        run: .github/scripts/resolve-version.py --input "$given" --dry-run "$dry_run"

      - name: fetch the ipas
        uses: actions/download-artifact@v8
        with:
          name: ipas

      - name: tag the build that went out
        env:
          version: ${{ steps.version.outputs.version }}
        run: |
          build_number=$(cat build-number.txt)
          [ -n "$build_number" ] || { echo "::error::build-number.txt is empty"; exit 1; }

          tag="build/$version/$build_number"

          # this job re-running behind a repaired upload is expected, so an
          # existing tag is only wrong when it names a different commit
          if git ls-remote --exit-code --tags origin "$tag" > /dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
            already=$(git rev-list -n1 "$tag")
            if [ "$already" != "$GITHUB_SHA" ]; then
              echo "::error::$tag already names $already, not $GITHUB_SHA (this upload did go through)"
              exit 1
            fi
            echo "$tag was already written by an earlier attempt"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" \
              -m "$version, build $build_number, uploaded to App Store Connect" \
              -m "run: $GITHUB_RUN_ID"
            git push origin "$tag"
          fi
          echo "\`$GITHUB_SHA\` is \`$tag\`" >> "$GITHUB_STEP_SUMMARY"

      # a draft creates no tag; publishing it does. --target takes the sha rather
      # than a branch, which would resolve to whatever main had become by then.
      # updated rather than created twice when a version needs another build to
      # clear review
      - name: draft the github release
        env:
          GH_TOKEN: ${{ github.token }}
          version: ${{ steps.version.outputs.version }}
        run: |
          .github/scripts/changelog-section.py --version "$version" > "${RUNNER_TEMP}/notes.md"

          if gh release view "$version" > /dev/null 2>&1; then
            gh release edit "$version" --target "$GITHUB_SHA" --notes-file "${RUNNER_TEMP}/notes.md"
          else
            # --generate-notes appends the pull requests below the changelog section
            gh release create "$version" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "$version" \
              --notes-file "${RUNNER_TEMP}/notes.md" \
              --generate-notes
          fi

          echo "drafted \`$version\`. publishing it writes the tag - do that once it is live." >> "$GITHUB_STEP_SUMMARY"
