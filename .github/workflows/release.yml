name: release

# Uploads to App Store Connect on a version tag, or by hand. The version is the
# tag: project.pbxproj holds 0.0.0 and the tag reaches xcodebuild as
# MARKETING_VERSION through fastlane's ODR_VERSION, so a release needs no commit.
on:
  workflow_dispatch:
    inputs:
      flavor:
        description: which app to build
        type: choice
        default: both
        options:
          - pro
          - lite
          - both
      # only for dispatched runs, which have no tag to read
      version:
        description: version to build, e.g. 1.36 - defaults to the tag
        type: string
      # exercises the signing path without putting a build on TestFlight
      dry_run:
        description: build and archive only, do not upload
        type: boolean
        default: false
  push:
    # bare numbers, as this repo has always used; a v prefix is stripped
    tags:
      - '[0-9]*'
      - 'v[0-9]*'

concurrency:
  # every release run, not just the ones on the same ref: the build number is a
  # live query of what TestFlight has, so two overlapping runs would read the
  # same one and hand the second upload a pair the store has already taken
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  xcode_version: "26.5"
  # false on a tag push, which always uploads
  dry_run: ${{ inputs.dry_run || false }}

jobs:
  upload:
    runs-on: macos-26
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        # the env context is unavailable here, so the tag push fallback is inline
        flavor: ${{ (!inputs.flavor || inputs.flavor == 'both') && fromJSON('["pro","lite"]') || fromJSON(format('["{0}"]', inputs.flavor)) }}
    steps:
      # a dry run signs too, so it needs the same secrets
      - name: check secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          SIGNING_CERTIFICATE_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_CONTENT SIGNING_CERTIFICATE_P12 SIGNING_CERTIFICATE_PASSWORD; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing repository secrets:$missing (see README)"
            exit 1
          fi

      - name: checkout
        uses: actions/checkout@v7

      # up front, so a run that cannot name a version ends before the twenty
      # minutes of setup and building rather than after
      - name: resolve version
        id: version
        # through the environment rather than interpolated into the run: line,
        # where a tag name or an input would be a shell injection
        env:
          tag: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          given: ${{ inputs.version }}
        run: .github/scripts/resolve-version.py --tag "$tag" --input "$given" --dry-run "$dry_run"

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.xcode_version }}

      # a throwaway keychain so the distribution certificate never outlives the job
      - name: import signing certificate
        env:
          SIGNING_CERTIFICATE_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"

          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          echo "$SIGNING_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$keychain" \
            -P "$SIGNING_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          rm "$RUNNER_TEMP/certificate.p12"

          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychain -d user -s "$keychain" login.keychain-db

          # this is the only certificate the build has - a development one here
          # would archive fine and fail the export twenty minutes in
          security find-identity -v -p codesigning "$keychain"
          if ! security find-identity -v -p codesigning "$keychain" | grep -q "Apple Distribution\|iPhone Distribution"; then
            echo "::error::SIGNING_CERTIFICATE_P12 holds no Apple Distribution certificate (see README)"
            exit 1
          fi

      # one step for both: a dry run builds the same thing and only stops short
      # of the upload
      - name: build and upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          # environment rather than lane options, which fastlane passes through
          # as strings - a false would arrive as "false" and read as true
          ODR_VERSION: ${{ steps.version.outputs.version }}
          ODR_DRY_RUN: ${{ env.dry_run }}
        run: bundle exec fastlane ${{ matrix.flavor == 'pro' && 'deployPro' || 'deployLite' }}

      # gym's log only says the export failed; the reason is in an
      # .xcdistributionlogs bundle under $TMPDIR, which dies with the runner
      - name: collect distribution logs
        if: failure()
        run: |
          mkdir -p distribution-logs
          find "${TMPDIR:-/tmp}" -maxdepth 1 -name '*.xcdistributionlogs' \
            -exec cp -R {} distribution-logs/ \;

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-log-${{ matrix.flavor }}
          path: |
            ~/Library/Logs/gym
            distribution-logs
            *.ipa
            *.app.dSYM.zip
          if-no-files-found: warn
